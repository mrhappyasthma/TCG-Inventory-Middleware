version: '3.8'

services:
  tcg-middleware:
    build: .
    container_name: tcg-ebay-middleware
    ports:
      # Change HOST_PORT in your .env or Synology Container Manager if 8080 is taken
      - "${HOST_PORT:-8080}:8080"
    volumes:
      # Maps persistent data directory on Synology NAS (adjust path if needed)
      - /volume1/docker/tcg-middleware:/data
    environment:
      - DATABASE_URL=/data/inventory.db
      - USER_DATABASE_URL=/data/users.db
      - AUTH_METHOD=${AUTH_METHOD:-local}
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-secure-random-string}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
