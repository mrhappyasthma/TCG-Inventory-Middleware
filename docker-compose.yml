services:
  tcg-middleware:
    build: .
    container_name: tcg-ebay-middleware
    ports:
      # Change HOST_PORT in your .env or Synology Container Manager if 8080 is taken.
      # Reach the dashboard through the DSM reverse proxy over HTTPS, not this
      # port directly: Google Sign-In cannot authorize a raw IP or plain HTTP origin.
      - "${HOST_PORT:-8080}:8080"
    volumes:
      # Databases and the session secret live in ./data beside this file, so the
      # whole deployment is one folder. Relative to the project directory rather
      # than an absolute /volume1 path, which keeps the file portable. NOTE: if
      # this pointed at the project root instead, the databases would be written
      # among the source files.
      - ./data:/data
    environment:
      - DATABASE_URL=/data/inventory.db
      - USER_DATABASE_URL=/data/users.db
      - SESSION_SECRET_FILE=/data/.session_secret
      # Required. The container will not start without it.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set in .env}
      # Optional: if blank, a random secret is generated and persisted to /data.
      - JWT_SECRET=${JWT_SECRET:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
    restart: unless-stopped
